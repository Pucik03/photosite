{% extends "base.html" %}

{% block content %}

<h1 style="margin-bottom:30px;">События</h1>

<div class="event-grid">

{% for event in events %}
    <div class="event-card">

        {% if event.preview_image %}
            <img src="{{ url_for('static', filename='uploads/' + event.preview_image) }}">
        {% endif %}

        <div class="event-content">
            <h2>{{ event.title }}</h2>

            <p>
                {{ event.description[:120] }}{% if event.description and event.description|length > 120 %}...{% endif %}
            </p>

            <a href="{{ url_for('public.event_detail', event_id=event.id) }}">
                <button class="btn">Смотреть фото</button>
            </a>
        </div>

    </div>
{% endfor %}

</div>

{% endblock %}
