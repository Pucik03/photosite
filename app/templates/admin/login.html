{% extends "base.html" %}

{% block content %}
<div class="admin-login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1>Добро пожаловать</h1>
            <p>Войдите в админ-панель</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            <span class="error-icon">⚠️</span>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Логин
                </label>
                <input type="text" name="username" id="username" placeholder="Введите логин" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Пароль
                </label>
                <input type="password" name="password" id="password" placeholder="Введите пароль" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            
            <button type="submit" class="login-btn">
                <span>Войти</span>
                <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>
        
        <div class="login-footer">
            <p>Безопасный вход в админ-панель</p>
        </div>
    </div>
</div>

<style>
    .admin-login-container {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    .login-card {
        background: var(--bg-secondary);
        border-radius: 24px;
        padding: 40px;
        max-width: 450px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        animation: fadeInUp 0.6s ease;
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .login-icon {
        font-size: 4rem;
        margin-bottom: 15px;
        display: inline-block;
        animation: bounce 1s ease infinite;
    }
    
    .login-header h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
        color: var(--text-primary);
    }
    
    .login-header p {
        color: var(--text-secondary);
        font-size: 0.9rem;
    }
    
    .error-message {
        background: rgba(231, 76, 60, 0.1);
        border-left: 3px solid #e74c3c;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #e74c3c;
        font-size: 0.9rem;
        animation: shake 0.5s ease;
    }
    
    .error-icon {
        font-size: 1.2rem;
    }
    
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        position: relative;
    }
    
    .form-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.5px;
    }
    
    .input-icon {
        width: 16px;
        height: 16px;
        stroke: var(--accent-primary);
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-family: 'Poppins', sans-serif;
        font-size: 0.95rem;
        transition: all 0.3s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(246, 142, 86, 0.1);
    }
    
    .form-group input:hover {
        border-color: var(--accent-muted);
    }
    
    .toggle-password {
        position: absolute;
        right: 12px;
        bottom: 12px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
    }
    
    .eye-icon {
        width: 20px;
        height: 20px;
        stroke: var(--text-muted);
        transition: stroke 0.3s;
    }
    
    .toggle-password:hover .eye-icon {
        stroke: var(--accent-primary);
    }
    
    .login-btn {
        background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 40px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s;
        margin-top: 10px;
        font-family: 'Poppins', sans-serif;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(246, 142, 86, 0.4);
    }
    
    .btn-arrow {
        width: 18px;
        height: 18px;
        stroke: white;
        transition: transform 0.3s;
    }
    
    .login-btn:hover .btn-arrow {
        transform: translateX(5px);
    }
    
    .login-footer {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
    }
    
    .login-footer p {
        color: var(--text-muted);
        font-size: 0.8rem;
    }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
    
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
    }
</script>
{% endblock %}
