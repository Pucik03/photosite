{% extends "base.html" %}

{% block content %}
<div class="group-detail-page">
    <div class="group-header">
        <h1>{{ group.title }}</h1>
        {% if group.event %}
        <p class="event-link">
            <a href="{{ url_for('public.event_detail', event_id=group.event.id) }}">
                ← Вернуться к событию "{{ group.event.title }}"
            </a>
        </p>
        {% endif %}
    </div>

    <div class="photo-grid-container">
        <div class="photo-grid">
            {% for photo in group.photos %}
            <div class="photo-card">
                <div class="photo-card-inner">
                    <div class="photo-image-wrapper">
                        <img
                            src="{{ url_for('static', filename='uploads/' + photo.thumb_filename) }}"
                            alt="Фото {{ loop.index }}"
                            loading="lazy"
                            class="photo-thumb"
                            onclick="openModal({{ loop.index0 }})"
                        >
                        <div class="photo-overlay">
                            <button class="quick-view-btn" onclick="openModal({{ loop.index0 }})">
                                🔍
                            </button>
                        </div>
                    </div>
                    <div class="photo-info">
                        <div class="price-tag">
                            <span class="price-amount">{{ "%.2f"|format(photo.price) }} ₽</span>
                        </div>
                        <form method="POST" action="{{ url_for('public.add_to_cart', photo_id=photo.id) }}" class="add-to-cart-form">
                            <button type="submit" class="cart-btn" title="В корзину">
                                🛒
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="empty-state">
                <p>📷 В этой группе пока нет фотографий</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Модальное окно для просмотра фото -->
<div id="modal" class="modal" onclick="closeModal()">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modal-image" src="" alt="Просмотр фото">
        <div class="modal-info">
            <div class="modal-price" id="modal-price"></div>
            <form id="modal-form" method="POST" action="">
                <button type="submit" class="cart-btn-large">🛒 Добавить в корзину</button>
            </form>
        </div>
        <button class="modal-prev" onclick="changeImage(-1)">❮</button>
        <button class="modal-next" onclick="changeImage(1)">❯</button>
    </div>
</div>

<script>
    // Данные для модального окна
    const photos = [
        {% for photo in group.photos %}
        {
            preview: "{{ url_for('static', filename='uploads/' + photo.preview_filename) }}",
            thumb: "{{ url_for('static', filename='uploads/' + photo.thumb_filename) }}",
            price: "{{ '%.2f'|format(photo.price) }}",
            add_url: "{{ url_for('public.add_to_cart', photo_id=photo.id) }}"
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];

    let currentPhotoIndex = 0;

    function openModal(index) {
        currentPhotoIndex = index;
        const photo = photos[currentPhotoIndex];
        document.getElementById('modal-image').src = photo.preview;
        document.getElementById('modal-price').innerHTML = `<strong>Цена:</strong> ${photo.price} ₽`;
        document.getElementById('modal-form').action = photo.add_url;
        document.getElementById('modal').style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function closeModal() {
        document.getElementById('modal').style.display = "none";
        document.body.style.overflow = "auto";
    }

    function changeImage(direction) {
        currentPhotoIndex += direction;
        if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
        if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;

        const photo = photos[currentPhotoIndex];
        document.getElementById('modal-image').src = photo.preview;
        document.getElementById('modal-price').innerHTML = `<strong>Цена:</strong> ${photo.price} ₽`;
        document.getElementById('modal-form').action = photo.add_url;
    }

    // Закрытие по Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>

<style>
    /* Группа заголовков */
    .group-header {
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .group-header h1 {
        font-size: 2rem;
        margin-bottom: 8px;
        color: var(--text-primary);
    }

    .event-link a {
        color: var(--text-secondary);
        text-decoration: none;
        transition: color 0.3s;
        font-size: 0.9rem;
    }

    .event-link a:hover {
        color: var(--accent-primary);
    }

    /* Контейнер сетки */
    .photo-grid-container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* Сетка фотографий */
    .photo-grid {
        display: grid;
        gap: 12px;
        margin-top: 20px;
    }

    /* Карточка фото - компактная */
    .photo-card {
        background: rgba(36, 36, 36, 0.9);
        backdrop-filter: blur(5px);
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .photo-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        background: rgba(36, 36, 36, 0.95);
    }

    .photo-card-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    /* Обертка для изображения - компактная */
    .photo-image-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.3);
        cursor: pointer;
    }

    .photo-thumb {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
    }

    .photo-card:hover .photo-thumb {
        transform: scale(1.03);
    }

    /* Оверлей при наведении */
    .photo-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .photo-card:hover .photo-overlay {
        opacity: 1;
    }

    .quick-view-btn {
        background: var(--accent-primary);
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .quick-view-btn:hover {
        background: var(--accent-hover);
        transform: scale(1.1);
    }

    /* Информация о фото - компактная */
    .photo-info {
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }

    .price-tag {
        flex: 1;
    }

    .price-amount {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent-primary);
    }

    .add-to-cart-form {
        margin: 0;
    }

    .cart-btn {
        background: var(--accent-primary);
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .cart-btn:hover {
        background: var(--accent-hover);
        transform: scale(1.05);
    }

    /* Пустое состояние */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        background: rgba(36, 36, 36, 0.9);
        backdrop-filter: blur(5px);
        border-radius: 16px;
        color: var(--text-muted);
        font-size: 1rem;
        grid-column: 1 / -1;
    }

    /* Модальное окно */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        position: relative;
        max-width: 90%;
        max-height: 90%;
        background: var(--bg-secondary);
        border-radius: 16px;
        overflow: hidden;
        animation: modalFadeIn 0.3s;
    }

    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .modal-content img {
        max-width: 100%;
        max-height: 70vh;
        display: block;
        margin: 0 auto;
    }

    .modal-info {
        padding: 20px;
        text-align: center;
        border-top: 1px solid var(--border-color);
    }

    .modal-price {
        font-size: 1.3rem;
        margin-bottom: 15px;
        color: var(--accent-primary);
        font-weight: 600;
    }

    .cart-btn-large {
        background: var(--accent-primary);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .cart-btn-large:hover {
        background: var(--accent-hover);
        transform: scale(1.02);
    }

    .close-modal {
        position: absolute;
        top: 15px;
        right: 25px;
        color: white;
        font-size: 35px;
        font-weight: bold;
        cursor: pointer;
        z-index: 1001;
        transition: color 0.3s;
    }

    .close-modal:hover {
        color: var(--accent-primary);
    }

    .modal-prev,
    .modal-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 20px;
        transition: background 0.3s;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-prev:hover,
    .modal-next:hover {
        background: rgba(0, 0, 0, 0.8);
    }

    .modal-prev {
        left: 20px;
    }

    .modal-next {
        right: 20px;
    }

    /* ===== СПЕЦИАЛЬНЫЕ СТИЛИ ДЛЯ СТРАНИЦЫ ГРУППЫ ===== */
    /* 9 фото в ряд на больших экранах */
    .group-detail-page .photo-grid {
        grid-template-columns: repeat(9, 1fr);
        gap: 12px;
    }

    /* Адаптивность для разных экранов */
    @media (max-width: 1400px) {
        .group-detail-page .photo-grid {
            grid-template-columns: repeat(7, 1fr);
        }
    }

    @media (max-width: 1200px) {
        .group-detail-page .photo-grid {
            grid-template-columns: repeat(6, 1fr);
        }
    }

    @media (max-width: 992px) {
        .group-detail-page .photo-grid {
            grid-template-columns: repeat(5, 1fr);
        }
    }

    @media (max-width: 768px) {
        .group-detail-page .photo-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .group-header h1 {
            font-size: 1.5rem;
        }

        .price-amount {
            font-size: 0.8rem;
        }

        .cart-btn {
            width: 28px;
            height: 28px;
            font-size: 14px;
        }

        .quick-view-btn {
            width: 32px;
            height: 32px;
            font-size: 16px;
        }
    }

    @media (max-width: 480px) {
        .group-detail-page .photo-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .photo-info {
            padding: 8px;
        }

        .price-amount {
            font-size: 0.75rem;
        }

        .cart-btn {
            width: 26px;
            height: 26px;
            font-size: 12px;
        }
    }
</style>
{% endblock %}
